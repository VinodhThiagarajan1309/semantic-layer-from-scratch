# Stardog data source: Amazon Redshift (fill host/password; keep out of git)
jdbc.url=jdbc:redshift://REDSHIFT_HOST:5439/dev
jdbc.username=admin
jdbc.password=CHANGE_ME
sql.schemas=c360
jdbc.driver=com.amazon.redshift.jdbc42.Driver

# No idle pooled connections, so Aurora can auto-pause and Redshift is not kept busy
testOnBorrow=true
timeBetweenEvictionRunsMillis=0
maxIdle=0
minIdle=0
