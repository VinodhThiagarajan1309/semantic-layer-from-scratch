# Stardog data source: Aurora PostgreSQL (fill host/password; keep out of git)
jdbc.url=jdbc:postgresql://AURORA_HOST:5432/c360?sslmode=require
jdbc.username=c360admin
jdbc.password=CHANGE_ME
sql.schemas=c360
jdbc.driver=org.postgresql.Driver

# No idle pooled connections, so Aurora can auto-pause and Redshift is not kept busy
testOnBorrow=true
timeBetweenEvictionRunsMillis=0
maxIdle=0
minIdle=0
